<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="Gabriel Rangel"> 
        <meta name="description" content="My Beyblade X Database is a source of detailed information about Takara Tomy's latest line in the Beyblade franchise, BEYBLADE X."> 
        <meta name="keywords" content="Beyblade, BEYBLADE X, database, wiki, Takara Tomy">
        <meta name="robots" content="index,follow">
        <title>Gabriel's Beyblade X Database</title>
        <link rel="stylesheet" href="styles.css">
        <script src="javascript.js" defer></script>
    </head>
    <body>
        <header>
            <h1>Beyblade X Database</h1>
            <nav>
                <ul>
                    <li>
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li>
                        <a class="nav-link" href="index.html">Beyblades</a>
                    </li>
                    <li>
                        <a class="nav-link" href="index.html">Parts</a>
                    </li>
                    <li>
                        <a class="nav-link" href="index.html">Products</a>
                    </li>
                    <li>
                        <a class="nav-link" href="contact.html">Contact</a>
                    </li>
                </ul>
            </nav>
        </header>
        <main>
            <section class="content">
                <h2>Feedback and Questions</h2>
                <form id="contact">
                    <label for="name">Your Name<span class="required">*</span></label>
                    <span class="errorname"></span>
                    <input type="text" id="name" name="name" autocomplete="name">
                    <label for="emailAdd">Your Email Address<span class="required">*</span></label>
                    <span class="erroremail"></span>
                    <input type="text" id="emailAdd" name="emailAdd">
                    <label for="comments">Your Comments<span class="required">*</span></label>
                    <span class="errorcomments"></span>
                    <textarea name="comments" id="comments"></textarea>
                    <span id="result"></span>
                    <input type="submit" id="submit">
                </form>
            </section>
        </main>
        <footer>
            <p>Beyblade X Database is not in any way affiliated with Hasbro, Takara Tomy, Sunrights Inc, d-rights inc, or any other official Beyblade license holders. This is a student project.</p>
        </footer>
